<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DikFaa — Loading</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            animation: bgFloat 12s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2%, -2%) rotate(2deg); }
            50% { transform: translate(-2%, 2%) rotate(-2deg); }
            75% { transform: translate(1%, -1%) rotate(1deg); }
        }

        /* ===== FLOATING ORBS ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite;
        }

        .orb:nth-child(1) {
            width: 350px;
            height: 350px;
            background: rgba(59, 130, 246, 0.06);
            top: -120px;
            left: -120px;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 450px;
            height: 450px;
            background: rgba(236, 72, 153, 0.05);
            bottom: -180px;
            right: -180px;
            animation-delay: -6s;
        }

        .orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: rgba(139, 92, 246, 0.04);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -12s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
        }

        /* ===== PARTICLES ===== */
        .particle {
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-10vh) scale(1) rotate(720deg);
                opacity: 0;
            }
        }

        /* ===== LOADING CONTAINER ===== */
        .loading-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: fadeInUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== LOGO ===== */
        .logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .logo-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 60px rgba(59, 130, 246, 0.15),
                0 0 120px rgba(236, 72, 153, 0.08),
                0 0 0 1px rgba(255,255,255,0.04) inset;
            animation: logoPulse 3s ease-in-out infinite;
            position: relative;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 60px rgba(59, 130, 246, 0.15), 0 0 120px rgba(236, 72, 153, 0.08); }
            50% { box-shadow: 0 0 80px rgba(59, 130, 246, 0.25), 0 0 160px rgba(236, 72, 153, 0.12); }
        }

        .logo-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(59, 130, 246, 0.3);
            border-bottom-color: rgba(236, 72, 153, 0.3);
            animation: spinRing 3s linear infinite;
        }

        .logo-ring:nth-child(2) {
            width: 160px;
            height: 160px;
            top: -20px;
            left: -20px;
            border-top-color: rgba(236, 72, 153, 0.15);
            border-bottom-color: rgba(59, 130, 246, 0.15);
            animation-duration: 5s;
            animation-direction: reverse;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .logo-text {
            font-family: 'Fredoka One', cursive;
            font-size: 44px;
            color: #fff;
            letter-spacing: -1px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.2);
        }

        /* ===== BRAND ===== */
        .brand-name {
            font-family: 'Fredoka One', cursive;
            font-size: 42px;
            background: linear-gradient(135deg, #3b82f6, #ec4899, #3b82f6);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradShift 3s ease-in-out infinite;
            letter-spacing: -0.5px;
            margin-top: 4px;
        }

        @keyframes gradShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .brand-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 6px;
            font-weight: 300;
            margin-top: -6px;
        }

        /* ===== LOADING BAR ===== */
        .loading-bar-wrapper {
            width: 280px;
            margin-top: 10px;
            position: relative;
        }

        .loading-bar-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #ec4899, #3b82f6);
            background-size: 200% 100%;
            border-radius: 4px;
            animation: fillProgress 3s ease-in-out forwards, shimmer 1.5s ease-in-out infinite;
            position: relative;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            10% { width: 5%; }
            25% { width: 18%; }
            40% { width: 32%; }
            55% { width: 50%; }
            70% { width: 68%; }
            85% { width: 85%; }
            95% { width: 95%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
        }

        .loading-percent {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.06);
            text-align: center;
            margin-top: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        /* ===== LOADING TEXT ===== */
        .loading-status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.04);
            letter-spacing: 2px;
            font-weight: 300;
            margin-top: -4px;
            min-height: 20px;
        }

        /* ===== DOTS ===== */
        .dots {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.1; }
            40% { transform: scale(1); opacity: 0.6; }
        }

        /* ===== FLASH EFFECT SAAT REDIRECT ===== */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #3b82f6, #ec4899);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .flash-overlay.active {
            opacity: 1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .logo-wrapper { width: 90px; height: 90px; }
            .logo-circle { width: 90px; height: 90px; }
            .logo-text { font-size: 32px; }
            .logo-ring { width: 110px; height: 110px; top: -10px; left: -10px; }
            .logo-ring:nth-child(2) { width: 130px; height: 130px; top: -20px; left: -20px; }
            .brand-name { font-size: 30px; }
            .loading-bar-wrapper { width: 200px; }
            .brand-sub { font-size: 11px; letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <!-- Flash Overlay -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- Orbs -->
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>

    <!-- Particles -->
    <div id="particles"></div>

    <!-- Loading Container -->
    <div class="loading-container" id="loadingContainer">
        
        <!-- Logo -->
        <div class="logo-wrapper">
            <div class="logo-circle">
                <span class="logo-text">DF</span>
            </div>
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
        </div>

        <!-- Brand -->
        <div class="brand-name">DikFaa</div>
        <div class="brand-sub">DIMENSI PERCAKAPAN</div>

        <!-- Loading Bar -->
        <div class="loading-bar-wrapper">
            <div class="loading-bar-track">
                <div class="loading-bar-fill" id="progressFill"></div>
            </div>
            <div class="loading-percent" id="percentText">0%</div>
        </div>

        <!-- Status Text -->
        <div class="loading-status" id="statusText">✦ Memuat sistem ✦</div>

        <!-- Dots -->
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // ===== PARTICLES =====
        (function createParticles() {
            const container = document.getElementById('particles');
            const colors = [
                'rgba(59, 130, 246, 0.12)',
                'rgba(236, 72, 153, 0.10)',
                'rgba(139, 92, 246, 0.08)',
                'rgba(59, 130, 246, 0.06)',
                'rgba(236, 72, 153, 0.06)'
            ];
            const shapes = ['50%', '4px 4px', '6px 2px'];

            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 5 + 2;
                p.style.width = size + 'px';
                p.style.height = (Math.random() > 0.5 ? size : size * 0.4) + 'px';
                p.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
                p.style.left = Math.random() * 100 + '%';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = (Math.random() * 25 + 18) + 's';
                p.style.animationDelay = (Math.random() * 20) + 's';
                p.style.opacity = Math.random() * 0.5 + 0.1;
                container.appendChild(p);
            }
        })();

        // ===== STATUS TEXT =====
        const statusMessages = [
            '✦ Memuat sistem ✦',
            '✦ Mengaktifkan dimensi ✦',
            '✦ Menyiapkan percakapan ✦',
            '✦ Hampir selesai ✦'
        ];

        // ===== PROGRESS BAR =====
        const progressFill = document.getElementById('progressFill');
        const percentText = document.getElementById('percentText');
        const statusText = document.getElementById('statusText');

        let progress = 0;
        const duration = 3000; // 3 DETIK
        const interval = 50;
        const step = 100 / (duration / interval);

        let statusIndex = 0;

        const progressInterval = setInterval(() => {
            progress += step;
            
            // Update status text di milestone tertentu
            if (progress >= 25 && statusIndex === 0) {
                statusIndex = 1;
                statusText.textContent = statusMessages[1];
            } else if (progress >= 50 && statusIndex === 1) {
                statusIndex = 2;
                statusText.textContent = statusMessages[2];
            } else if (progress >= 75 && statusIndex === 2) {
                statusIndex = 3;
                statusText.textContent = statusMessages[3];
            }

            if (progress >= 100) {
                progress = 100;
                clearInterval(progressInterval);
                
                // Flash effect
                const flash = document.getElementById('flashOverlay');
                flash.classList.add('active');
                
                // Redirect setelah flash
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 600);
            }

            progressFill.style.width = progress + '%';
            percentText.textContent = Math.floor(progress) + '%';
        }, interval);

        // ===== FALLBACK =====
        setTimeout(() => {
            if (progress < 100) {
                const flash = document.getElementById('flashOverlay');
                flash.classList.add('active');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 600);
            }
        }, 3800);
    </script>

</body>
</html>
