<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — DikFaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(59,130,246,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(236,72,153,0.1) 0%, transparent 50%);
            animation: bgFloat 12s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes bgFloat {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            50% { transform: translate(-1%,1%) rotate(-1deg); }
        }
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .code {
            font-family: 'Fredoka One', cursive;
            font-size: 120px;
            background: linear-gradient(135deg, #3b82f6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .title {
            font-size: 24px;
            color: rgba(255,255,255,0.3);
            font-weight: 300;
            margin: 8px 0;
            letter-spacing: 2px;
        }
        .desc {
            font-size: 14px;
            color: rgba(255,255,255,0.08);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #3b82f6, #ec4899);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 40px rgba(59,130,246,0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="title">Halaman Tidak Ditemukan</div>
        <div class="desc">Sepertinya kamu tersesat di dimensi lain</div>
        <a href="/" class="btn">← Kembali ke DikFaa</a>
    </div>
</body>
</html>
